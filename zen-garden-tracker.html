<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zen Garden — Daily Clarity Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f110f">
<meta name="apple-mobile-web-app-title" content="Zen Garden">

<!-- ══ PWA · installable web app ═══════════════════════════════════════════
     iOS only treats a site as a real app — and only ever permits web push —
     when it has a manifest AND a service worker, AND you add it to the Home
     Screen. Add to Home Screen from Safari's share sheet to get the icon,
     fullscreen and (later) notifications. -->
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    // updateViaCache:'none' — the browser caches sw.js itself, which can leave
    // an old worker running (and an old cache strategy with it) long after a
    // deploy. This forces the worker script to always be revalidated.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function (e) {
      console.warn('[pwa] service worker registration failed', e);
    });
  });
  // A new deploy: the new worker has already fetched the fresh pages, takes
  // over, and says so. If you've only just opened the app (or left it idle),
  // reload into the new version straight away; if you're mid-task, offer a
  // one-tap refresh instead of pulling the page out from under you.
  var swHadController = !!navigator.serviceWorker.controller;   // false on first install
  var swLastInput = 0;
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) {
    addEventListener(t, function () { swLastInput = Date.now(); }, true);
  });
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'sw-updated' || !swHadController) return;
    var ae = document.activeElement;
    var typing = ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable);
    var busy = typing || (swLastInput && Date.now() - swLastInput < 30000) || document.querySelector('.scrim, .sched-modal-overlay, .auth-modal.active');
    var last = 0; try { last = +sessionStorage.getItem('sw_reloaded_at') || 0; } catch (_) {}
    if (!busy && Date.now() - last > 15000) {
      try { sessionStorage.setItem('sw_reloaded_at', String(Date.now())); } catch (_) {}
      location.reload();
      return;
    }
    if (document.getElementById('sw-update-pill')) return;
    var b = document.createElement('button');
    b.id = 'sw-update-pill';
    b.type = 'button';
    b.textContent = '✨ Updated — tap to refresh';
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:2147483646;' +
      'padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(18,20,28,.94);color:#fff;' +
      'font:600 13px system-ui,-apple-system,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;';
    b.onclick = function () { location.reload(); };
    document.body.appendChild(b);
  });
}
</script>

<!-- ── TRACKERS HUB · cross-device sync ──────────────────────────────────
     Must load before any app script so localStorage writes are captured
     from the very first one. Remove these two lines to disable sync
     entirely; the app then behaves exactly as it did before. -->
<script src="sync-config.js?v=20260925a"></script>
<script src="sync-engine.js?v=20260925a"></script>
<script src="push-client.js?v=20260925a"></script>
<script src="zen-rules.js?v=20260925a"></script>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f110f;
    --surface: #181a18;
    --surface2: #1e211e;
    --border: #2a2d2a;
    --text: #e8e5df;
    --text-dim: #8a8780;
    --text-faint: #555350;
    --accent: #7cb87c;
    --accent-dim: #3a5c3a;
    --accent-glow: rgba(124, 184, 124, 0.15);
    --danger: #c47a6e;
    --gold: #c9b458;
    --gold-dim: rgba(201, 180, 88, 0.1);
    /* Sleep section reuses every --accent-* rule below by swapping these in
       via body.habit-sleep, instead of duplicating each rule for a 2nd color. */
    --sleep-accent: #7fa1e0;
    --sleep-accent-dim: #33456b;
    --sleep-accent-glow: rgba(127, 161, 224, 0.18);
  }

  body.habit-sleep {
    --accent: var(--sleep-accent);
    --accent-dim: var(--sleep-accent-dim);
    --accent-glow: var(--sleep-accent-glow);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    /* Used to be hidden, relying on everything fitting exactly one screen —
       two habit tabs plus their own content made that unreliable, so it
       scrolls now at every width, the same as it already did on mobile. */
    overflow-y: auto;
    zoom: 0.99;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* Subtle animated grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  html, body { height: 100%; }

  .app {
    max-width: 1220px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 20px 32px 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }

  /* ─── Habit tabs (No PMO / Sleep ≤7h) ─── */
  .habit-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .habit-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 9px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .habit-tab:hover { color: var(--text); border-color: var(--accent-dim); }
  .habit-tab.active {
    background: linear-gradient(135deg, var(--surface2), var(--surface));
    border-color: var(--accent);
    color: var(--text);
  }
  .habit-tab .ht-icon { font-size: 14px; }
  .habit-tab .ht-streak {
    font-size: 11px;
    color: var(--text-faint);
    background: rgba(255,255,255,0.05);
    border-radius: 999px;
    padding: 1px 7px;
  }
  .habit-tab.active .ht-streak { color: var(--accent); }
  .zen-note {
    font-size: 11px;
    color: var(--text-faint);
    line-height: 1.5;
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    margin-bottom: 15px;
  }
  @media (max-width: 480px) {
    .habit-tab { font-size: 11.5px; padding: 8px; }
    .habit-tab .ht-streak { display: none; }
  }

  /* ─── Header ─── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent-dim), #2a3d2a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .logo-text h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .logo-text span {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .header-stats {
    display: flex;
    gap: 22px;
    align-items: center;
  }

  .header-stat {
    text-align: right;
  }

  .header-stat .value {
    font-family: 'Instrument Serif', serif;
    font-size: 26px;
    color: var(--text);
    line-height: 1;
  }

  .header-stat .value.accent { color: var(--accent); }
  .header-stat .value.gold { color: var(--gold); }

  .header-stat .label {
    font-size: 12px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  /* ─── Streak Banner ─── */
  .streak-banner {
    background: linear-gradient(135deg, var(--surface), var(--surface2));
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 15px 22px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .streak-banner::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    pointer-events: none;
  }

  .streak-left {
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 1;
  }

  .streak-flame {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    background: var(--accent-glow);
    border: 1px solid var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
  }

  .streak-info h2 {
    font-family: 'Instrument Serif', serif;
    font-size: 19px;
    font-weight: 400;
    color: var(--text);
  }

  .streak-info h2 em {
    font-style: italic;
    color: var(--accent);
  }

  .streak-info p {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .streak-right {
    z-index: 1;
  }

  .today-btn {
    background: var(--accent);
    color: #111;
    border: none;
    padding: 10px 22px;
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.01em;
  }

  .today-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(124, 184, 124, 0.3);
  }

  .today-btn.done {
    background: var(--surface2);
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    cursor: default;
  }

  .today-btn.done:hover {
    transform: none;
    box-shadow: none;
  }

  .skip-btn {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 10px 18px;
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.01em;
    opacity: 0.7;
  }

  .skip-btn:hover {
    opacity: 1;
    background: rgba(196, 122, 110, 0.1);
  }

  .skip-btn.skipped {
    background: rgba(196, 122, 110, 0.1);
    color: var(--danger);
    border-color: var(--danger);
    cursor: default;
    opacity: 0.8;
  }

  .skip-btn.skipped:hover {
    background: rgba(196, 122, 110, 0.1);
  }

  .btn-group {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  /* ─── System Navigation (hub switch / search) ─── */
  .hubnav-btn {
    flex: 1;
    background: var(--surface2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 9px 10px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .hubnav-btn:hover {
    border-color: var(--accent-dim);
    color: var(--text);
    background: rgba(124, 184, 124, 0.05);
  }
  .hubnav-btn-icon { font-size: 14px; opacity: 0.7; }
  .hubnav-btn .tsync-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .hubnav-btn-kbd { font-size: 9px; opacity: 0.35; letter-spacing: 0.08em; }
  /* NOTE: hub-nav.js deliberately keeps its own floating pill hidden on this
     page at every width (it knows Zen bakes this card in instead) — so these
     buttons must stay visible always. Do not hide them by breakpoint. */

  .cal-day.skipped {
    color: var(--danger);
    opacity: 0.7;
    background: rgba(196, 122, 110, 0.08);
  }

  .cal-day.skipped::after {
    content: '✕';
    position: absolute;
    bottom: 2px;
    font-size: 7px;
    color: var(--danger);
    width: auto;
    height: auto;
    border-radius: 0;
    background: none;
  }

  /* ─── Main Grid ─── */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 15px;
    margin-bottom: 15px;
    flex: 1;
    min-height: 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 15px 17px;
  }

  /* what the streak does to break time in the Procrastination Hub */
  .zen-breaks {
    display: flex; align-items: center; gap: 14px; margin-bottom: 15px; padding: 12px 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
  }
  .zen-breaks .zb-icon { font-size: 22px; line-height: 1; flex-shrink: 0; }
  .zen-breaks .zb-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .zen-breaks .zb-text b { font-size: 13px; font-weight: 600; }
  .zen-breaks .zb-text span { font-size: 11.5px; color: var(--text-dim); line-height: 1.55; }
  .zen-breaks .zb-text span b { color: inherit; font-size: inherit; }
  .zen-breaks .zb-text span s { opacity: .55; }
  .zen-breaks .zb-text span i { opacity: .8; }
  .zen-breaks.reward  { border-color: rgba(120, 190, 130, 0.5); background: linear-gradient(135deg, rgba(120,190,130,0.10), var(--surface)); }
  .zen-breaks.penalty { border-color: rgba(214, 120, 120, 0.5); background: linear-gradient(135deg, rgba(214,120,120,0.10), var(--surface)); }
  .zen-breaks .zb-toggle {
    flex-shrink: 0; padding: 4px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 11px; font-weight: 600;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  }
  .zen-breaks .zb-toggle:hover { color: var(--text); }

  #zen-card-calendar {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .card-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: '';
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent-dim);
  }

  /* ─── Calendar Grid ─── */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .month-nav h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 17px;
    font-weight: 400;
  }

  .month-nav button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 28px;
    height: 28px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.15s;
  }

  .month-nav button:hover {
    border-color: var(--accent-dim);
    color: var(--text);
  }

  .cal-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }

  .cal-header span {
    text-align: center;
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 0;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  .cal-day {
    aspect-ratio: unset;
    height: 53px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    border: 1px solid transparent;
  }

  .cal-day:hover:not(.empty):not(.future) {
    border-color: var(--border);
    background: var(--surface2);
  }

  .cal-day.empty { cursor: default; }
  .cal-day.future { color: var(--text-faint); opacity: 0.3; cursor: default; }

  .cal-day.today {
    border-color: var(--accent-dim);
    color: var(--text);
    font-weight: 500;
  }

  .cal-day.tended {
    background: var(--accent-glow);
    color: var(--accent);
    font-weight: 500;
  }

  .cal-day.tended::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }

  .cal-day.missed {
    color: var(--danger);
    opacity: 0.6;
  }

  .cal-day.missed::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--danger);
  }

  /* ─── Side Panel ─── */
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  /* Last card absorbs any leftover height so the sidebar always matches
     the calendar column's height exactly, regardless of viewport size
     or how many weeks the current month's grid needs. Title stays
     pinned at top; only the quote area grows and centers within it. */
  .side-panel > .card:last-child {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .side-panel > .card:last-child > div:last-child {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Milestones */
  .milestones {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .milestone {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 10px;
    border-radius: 9px;
    background: var(--surface2);
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .milestone.achieved {
    border-color: var(--gold);
    background: var(--gold-dim);
  }

  .milestone-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .milestone.achieved .milestone-icon {
    background: rgba(201, 180, 88, 0.15);
  }

  .milestone-info {
    flex: 1;
    min-width: 0;
  }

  .milestone-info h4 {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 0;
  }

  .milestone.achieved .milestone-info h4 {
    color: var(--gold);
  }

  .milestone-info p {
    font-size: 10px;
    color: var(--text-faint);
  }

  .milestone-check {
    font-size: 12px;
    color: var(--text-faint);
    flex-shrink: 0;
  }

  .milestone.achieved .milestone-check {
    color: var(--gold);
  }

  /* ─── Weekly Rhythm ─── */
  .rhythm-row {
    display: flex;
    gap: 4px;
    margin-top: 2px;
  }

  .rhythm-bar {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .rhythm-fill {
    width: 100%;
    height: 40px;
    border-radius: 6px;
    background: var(--surface2);
    position: relative;
    overflow: hidden;
  }

  .rhythm-fill .inner {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: var(--accent-dim);
    border-radius: 6px;
    transition: height 0.3s ease;
  }

  .rhythm-fill.full .inner {
    background: var(--accent);
    opacity: 0.7;
  }

  .rhythm-label {
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ─── Journal ─── */
  .journal-area {
    margin-top: 0;
  }

  #zen-card-reflections {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  #zen-card-reflections .journal-area {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  #zen-card-reflections .journal-textarea {
    flex: 1;
    min-height: 60px;
  }

  .journal-textarea {
    width: 100%;
    min-height: 50px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;

<script>
// ─── HABITS ───

// zen_garden_data (No PMO) is untouched in shape and key, so zen-rules.js,
// the Procrastination Hub and the Study todo bridge all keep working exactly

const HABITS = {

      { text: "Your alarm is not the enemy. The snooze button is.", attr: "— Unknown" },
      { text: "Consistency in sleep is worth more than any single long night.", attr: "— Behavioral Science" },
      { text: "The body keeps the schedule you give it — give it a good one.", attr: "— Sleep Hygiene" },
      { text: "Rest is medicine. Too much of it becomes a different kind of tiredness.", attr: "— Anonymous" },
      { text: "Every morning you rise on time, you vote for who you want to be.", attr: "— Habit Science" },
      { text: "Recovery has a dose. More is not always better.", attr: "— Sleep Hygiene" },
    ],
    warningMessages: [

      "You know this doesn't serve you. Reset.",
      "One long night. Don't make it a habit.",
    ],
  },
};
let activeHabit = 'pmo';
function H(id) { return HABITS[id || activeHabit]; }
function switchHabit(id) {
  if (!HABITS[id] || id === activeHabit) return;
  activeHabit = id;
  render();
}

// ─── DATA LAYER (localStorage) ───
function loadData(habitId) {
  const raw = localStorage.getItem(H(habitId).key);
  if (raw) {
    const d = JSON.parse(raw);
    if (!d.skipped) d.skipped = {};
    return d;
  }
  return { days: {}, skipped: {}, journal: {}, startDate: localDate(new Date()) };
}

function saveData(data, habitId) {
  localStorage.setItem(H(habitId).key, JSON.stringify(data));
}

// Local date helper — avoids UTC timezone shift
function localDate(d) {
  const dt = d || new Date();
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}

function todayStr() {
  return localDate(new Date());
}

function dateStr(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// ─── STREAK CALCULATION ───
function calcStreak(data) {
  let streak = 0;
  const d = new Date();
  // If today not yet marked, start checking from today (allow marking today still)
  // If today is marked, include it
  while (true) {
    const key = localDate(d);
    if (data.days[key]) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else if (key === todayStr()) {
      // today not yet marked, still check yesterday
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function calcTotal(data) {
  return Object.values(data.days).filter(Boolean).length;
}

function calcBestStreak(data) {
  const sorted = Object.keys(data.days).filter(k => data.days[k]).sort();
  if (!sorted.length) return 0;
  let best = 1, cur = 1;
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(sorted[i-1]);
    const curr = new Date(sorted[i]);
    const diff = (curr - prev) / 86400000;
    if (diff === 1) { cur++; best = Math.max(best, cur); }
    else { cur = 1; }
  }
  return best;
}

// ─── WEEKLY RHYTHM ───
function getWeekData(data) {
  const today = new Date();
  const dayOfWeek = today.getDay(); // 0=Sun
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((dayOfWeek + 6) % 7));
  
  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const key = localDate(d);
    const isFuture = d > today;
    const isToday = key === todayStr();
    weekDays.push({
      label: ['M','T','W','T','F','S','S'][i],
      done: !!data.days[key],
      skipped: !!data.skipped[key],
      future: isFuture && !isToday,
      today: isToday
    });
  }
  return weekDays;
}

// ─── MILESTONES ───
function getMilestones(streak, total, habitId) {
  const icons = H(habitId).milestoneIcons;
  return [
    { icon: icons[0], name: 'First Seed', desc: 'Complete your first day', threshold: 1, check: total >= 1 },
    { icon: icons[1], name: 'One Week', desc: '7-day streak', threshold: 7, check: streak >= 7 },
    { icon: icons[2], name: 'Deep Roots', desc: '30-day streak', threshold: 30, check: streak >= 30 },
    { icon: icons[3], name: 'Summit', desc: '90-day streak', threshold: 90, check: streak >= 90 },
    { icon: icons[4], name: 'Full Bloom', desc: '365 days total', threshold: 365, check: total >= 365 },
  ];
}

// ─── QUOTES ───
function getQuote(habitId) {
  const list = H(habitId).quotes;
  const idx = new Date().getDate() % list.length;
  return list[idx];
}

// ─── CONFETTI ───
function fireConfetti(habitId) {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const colors = H(habitId).confettiColors;

  for (let i = 0; i < 60; i++) {
    particles.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 200,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: Math.random() * -14 - 4,
      size: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      life: 1
    });
  }
  
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    
    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx;
      p.vy += 0.3;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      p.life -= 0.012;
      
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    });
    
    if (alive) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  
  animate();
}

// ─── RENDER ───
// Each habit remembers which calendar month it was browsing independently.
let viewYM = (function () {
  const n = new Date();
  return { pmo: { y: n.getFullYear(), m: n.getMonth() }, sleep: { y: n.getFullYear(), m: n.getMonth() } };
})();

// What your habits are doing to your break time in the Procrastination Hub (rules live in
// zen-rules.js). Today's actual effect (adj) is combined across ALL sources — Zen, Sleep
// and Rituals — regardless of which tab is open; only the "streak / next reward" half of
// this strip is specific to the tab you're viewing.
function zenBreakStrip(habitId) {
  if (!window.ZenRules) return '';
  const st = ZenRules.status(), adj = st.adj, rw = st.rituals;
  const own = habitId === 'sleep' ? st.sleep : st;                    // this tab's own streak/next/warn
  const missWord = habitId === 'sleep' ? 'oversleeping' : 'without Zen';
  const reward = t => t === 7 ? '+2h (1h free time + 1h on your first earned break)' : '+30 min free time';
  const penalty = t => t === 7 ? '−2h (free time gone + your first earned break cut by 1h)' : '−30 min free time';
  let icon = habitId === 'sleep' ? '😴' : '🌿', title, cls = '';
  const lines = [];
  if (!st.enabled) {
    icon = '💤'; title = 'Break-time rewards are off';
    lines.push('Your Zen and Sleep streaks and the Rituals week aren\'t changing your free time in the Procrastination Hub.');
  } else if (adj.parts && adj.parts.length) {
    icon = adj.kind === 'penalty' ? '🥀' : adj.kind === 'even' ? '⚖️' : '🎁';
    cls = adj.kind === 'even' ? '' : adj.kind;
    title = adj.kind === 'even' ? 'Reward and penalty cancel out today'
          : adj.kind === 'penalty' ? 'Break time is cut today' : 'Bonus break time today';
    adj.parts.forEach(p => lines.push(p.applied ? p.label : `<s>${p.label}</s> — not added`));
    if (adj.combined) lines.push('<i>' + adj.combined + '</i>');
  } else {
    title = `Streak ${own.streak}`;
    if (own.next) lines.push(`Next reward: <b>${own.next.at}-day streak</b> in ${own.next.inDays} day${own.next.inDays === 1 ? '' : 's'} — ${reward(own.next.tier)}`);
    if (own.missRun > 0 && own.warn) lines.push(`⚠️ ${own.missRun} day${own.missRun === 1 ? '' : 's'} ${missWord} — ${own.warn.at} in a row costs ${penalty(own.warn.tier)}, in ${own.warn.inDays} day${own.warn.inDays === 1 ? '' : 's'}`);
    if (!lines.length) lines.push(habitId === 'sleep'
      ? 'Stay under 7 hours — every 3rd day earns break time, every 7th earns more.'
      : 'Keep tending your garden — every 3rd day earns break time, every 7th earns more.');
  }
  if (st.enabled && rw && rw.counted) {
    const goal = rw.toGo === 0 ? `on track for the weekly reward` : `${rw.toGo} more for the weekly reward`;
    lines.push(`🧴 Rituals this week: ${rw.done} of ${rw.counted} done (${rw.pct}%) — ${goal}${rw.counts ? '' : ' (this week started before the rules, so it won\'t count)'}`);
  }
  return `<div class="zen-breaks ${cls}">
      <div class="zb-icon">${icon}</div>
      <div class="zb-text"><b>${title}</b>${lines.map(l => `<span>${l}</span>`).join('')}</div>
      <button class="zb-toggle" onclick="zenToggleBreaks()" title="Turn the break-time rewards and penalties on or off">${st.enabled ? 'On' : 'Off'}</button>
    </div>`;
}
// Either habit changing on another device redraws this one
window.addEventListener('storage', e => { if (e.key === 'zen_garden_data' || e.key === 'zen_sleep_data') render(); });
function zenToggleBreaks() { if (window.ZenRules) { ZenRules.setEnabled(!ZenRules.enabled()); render(); } }

function render() {
  const h = H();
  const pmoData = loadData('pmo'), sleepData = loadData('sleep');
  const data = activeHabit === 'pmo' ? pmoData : sleepData;
  const pmoStreak = calcStreak(pmoData), sleepStreak = calcStreak(sleepData);
  const streak = activeHabit === 'pmo' ? pmoStreak : sleepStreak;
  const total = calcTotal(data);
  const best = calcBestStreak(data);
  const todayDone = !!data.days[todayStr()];
  const todaySkipped = !!data.skipped[todayStr()];
  const week = getWeekData(data);
  const milestones = getMilestones(streak, total);
  const quote = getQuote();
  const journal = data.journal[todayStr()] || '';

  document.body.classList.toggle('habit-sleep', activeHabit === 'sleep');

  // Calendar
  const { y: viewYear, m: viewMonth } = viewYM[activeHabit];
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const offset = (firstDay + 6) % 7; // Monday start
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const monthName = new Date(viewYear, viewMonth).toLocaleString('en', { month: 'long', year: 'numeric' });

  // Which days were tended at the last render — anything new since gets the pop.
  window.__zenTended = window.__zenTended || {};
  const prevTended = window.__zenTended[activeHabit] || null;
  window.__zenTended[activeHabit] = Object.assign({}, data.days);

  let calDays = '';
  for (let i = 0; i < offset; i++) calDays += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateStr(viewYear, viewMonth, d);
    const isToday = key === todayStr();
    const isFuture = new Date(key) > new Date(todayStr());
    const done = data.days[key];
    const skipped = data.skipped[key];
    const isPast = !isFuture && !isToday;
    const hasJournal = !!(data.journal[key] && data.journal[key].trim());

    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isFuture) cls += ' future';
    if (done) cls += ' tended';
    if (done && prevTended && !prevTended[key]) cls += ' just-tended';
    else if (skipped) cls += ' skipped';
    else if (isPast && key >= data.startDate) cls += ' missed';

    const journalDot = hasJournal ? `<span style="position:absolute; top:4px; right:5px; width:4px; height:4px; border-radius:50%; background:var(--gold);"></span>` : '';
    calDays += `<div class="${cls}" data-date="${key}" ${!isFuture ? `onclick="toggleDay('${key}')"` : ''}>${d}${journalDot}</div>`;
  }

  const app = document.getElementById('app');
  app.classList.toggle('enter', !window.__zenRendered);   // first render only
  window.__zenRendered = true;
  app.innerHTML = `
    <div class="habit-tabs">
      <button class="habit-tab ${activeHabit === 'pmo' ? 'active' : ''}" onclick="switchHabit('pmo')">
        <span class="ht-icon">${HABITS.pmo.tabIcon}</span> ${HABITS.pmo.tabLabel} <span class="ht-streak">${pmoStreak} 🔥</span>
      </button>
      <button class="habit-tab ${activeHabit === 'sleep' ? 'active' : ''}" onclick="switchHabit('sleep')">
        <span class="ht-icon">${HABITS.sleep.tabIcon}</span> ${HABITS.sleep.tabLabel} <span class="ht-streak">${sleepStreak} 🔥</span>
      </button>
    </div>

    <div class="header">
      <div class="logo-area">
        <div class="logo-icon">${h.logo}</div>
        <div class="logo-text">
          <h1>${h.title}</h1>
          <span>${h.subtitle}</span>
        </div>
      </div>
      <div class="header-stats">
        <div class="header-stat">
          <div class="value accent">${streak}</div>
          <div class="label">Current Streak</div>
        </div>
        <div class="header-stat">
          <div class="value gold">${best}</div>
          <div class="label">Best Streak</div>
        </div>
        <div class="header-stat">
          <div class="value">${total}</div>
          <div class="label">Total Days</div>
        </div>
      </div>
    </div>

    <div class="streak-banner">
      <div class="streak-left">
        <div class="streak-flame">${streak > 0 ? '🔥' : h.zeroFlame}</div>
        <div class="streak-info">
          <h2>${streak > 0 ? `<em>${streak}</em> day${streak > 1 ? 's' : ''} ${h.streakUnit}` : 'Start your journey today'}</h2>
          <p>${todayDone ? h.doneStatusMsg : todaySkipped ? h.skipStatusMsg : h.awaitMsg}</p>
        </div>
      </div>
      <div class="streak-right">
        <div class="btn-group">
          ${todayDone || todaySkipped ? '' : `<button class="skip-btn" onclick="skipToday()">${h.skipBtnLabel}</button>`}
          ${todaySkipped ? `<button class="skip-btn skipped">${h.skippedLabel}</button>` : ''}
          <button class="today-btn ${todayDone ? 'done' : ''}" onclick="${todayDone ? '' : 'markToday()'}">
            ${todayDone ? h.doneDoneLabel : h.doneBtnLabel}
          </button>
        </div>
      </div>
    </div>

    ${zenBreakStrip(activeHabit)}

    <div class="main-grid">
      <div class="card" id="zen-card-calendar">
        <div class="card-title">${h.calendarTitle}</div>
        <div class="month-nav">
          <button onclick="changeMonth(-1)">←</button>
          <h3>${monthName}</h3>
          <button onclick="changeMonth(1)">→</button>
        </div>
        <div class="cal-header">
          ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<span>${d}</span>`).join('')}
        </div>
        <div class="cal-grid">${calDays}</div>

        <div style="margin-top: 10px;" id="zen-card-reflections">
          <div class="card-title">Reflections</div>
          <div class="journal-area">
            <textarea class="journal-textarea" placeholder="${h.journalPlaceholder}" oninput="saveJournal(this.value)">${journal}</textarea>
            <div class="journal-hint">Private — only you can see this</div>
          </div>
        </div>
      </div>

      <div class="side-panel">
        <div class="card">
          <div class="card-title">System Navigation</div>
          <div class="hubnav-switch-search" style="display:flex; gap:8px;">
            <button class="hubnav-btn" onclick="window.hubNavSwitch && window.hubNavSwitch(event)">
              <span class="hubnav-btn-icon">⬡</span> Switch App
            </button>
            <button class="hubnav-btn" onclick="window.hubNavSearch && window.hubNavSearch()">
              <span class="hubnav-btn-icon">🔍</span> Search <span class="hubnav-btn-kbd">⌘K</span>
            </button>
          </div>
          <!-- Sync + notifications, baked into the template like the two above.
               This page rebuilds its whole DOM on every render, so anything
               injected from outside gets wiped; declaring them here means they
               survive re-renders with no flicker. sync-engine paints the dot by
               finding [data-tsync-baked] rather than adding one of its own. -->
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="hubnav-btn" data-tsync data-tsync-baked
                    title="Sync status — click to sync now"
                    onclick="window.TrackersSync && window.TrackersSync.forceSync()">
              <span class="tsync-dot"></span> <span class="zen-sync-label">Sync</span>
            </button>
            <button class="hubnav-btn" data-tpush-baked
                    title="Notification settings"
                    onclick="window.TrackersPush && window.TrackersPush.openSettings()">
              <span class="hubnav-btn-icon">🔔</span> Alerts
            </button>
          </div>
        </div>

        <div class="card" id="zen-card-rhythm">
          <div class="card-title">This Week's Rhythm</div>
          <div class="rhythm-row">
            ${week.map(w => `
              <div class="rhythm-bar">
                <div class="rhythm-fill ${w.done ? 'full' : w.skipped ? 'skip' : ''}">
                  <div class="inner" style="height: ${w.done ? '100%' : w.skipped ? '100%' : w.future ? '0%' : '20%'}; ${w.skipped ? 'background: var(--danger); opacity: 0.4;' : ''}"></div>
                </div>
                <span class="rhythm-label" style="${w.today ? 'color: var(--accent); font-weight: 500;' : ''}">${w.label}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="card" id="zen-card-milestones">
          <div class="card-title">Milestones</div>
          <div class="milestones">
            ${milestones.map(m => `
              <div class="milestone ${m.check ? 'achieved' : ''}">
                <div class="milestone-icon">${m.icon}</div>
                <div class="milestone-info">
                  <h4>${m.name}</h4>
                  <p>${m.desc}</p>
                </div>
                <span class="milestone-check">${m.check ? '✦' : '○'}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="card" id="zen-card-wisdom">
          <div class="card-title">Today's Wisdom</div>
          <div>
            <p style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 12px; color: var(--text-dim); line-height: 1.4;">${quote.text}</p>
            <p style="font-size: 9px; color: var(--text-faint); margin-top: 4px; letter-spacing: 0.04em;">${quote.attr}</p>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ─── ACTIONS ───
function markToday() {
  const data = loadData();
  if (!data.days[todayStr()]) {
    data.days[todayStr()] = true;
    delete data.skipped[todayStr()]; // clear skip if they changed mind
    saveData(data);
    fireConfetti();
    render();
  }
}

function skipToday() {
  const data = loadData();
  if (!data.days[todayStr()] && !data.skipped[todayStr()]) {
    data.skipped[todayStr()] = true;
    saveData(data);
    fireWarning(calcStreak(data));
    render();
  }
}

// ─── WARNING / PUNISHMENT ANIMATION ───
function fireWarning(streakBefore) {
  const h = H();
  // Shake the entire app
  const app = document.getElementById('app');
  app.classList.add('shake');
  setTimeout(() => app.classList.remove('shake'), 600);

  // Show warning overlay
  const overlay = document.getElementById('warning-overlay');
  const msgs = h.warningMessages;
  const msg = msgs[Math.floor(Math.random() * msgs.length)];
  const streakText = streakBefore > 0 ? `${streakBefore}-day streak lost` : 'No streak to protect';

  overlay.innerHTML = `
    <div class="red-flash"></div>
    <div class="warning-card">
      <div class="warning-icon">⚠️</div>
      <div class="warning-title">${h.warningTitle}</div>
      <div class="warning-msg">${msg}</div>
      <div class="warning-streak-lost">${streakText}</div>
    </div>
  `;

  // Fade out after 2.5s
  setTimeout(() => {
    const card = overlay.querySelector('.warning-card');
    if (card) card.classList.add('fade-out');
    setTimeout(() => { overlay.innerHTML = ''; }, 400);
  }, 2500);
}

function toggleDay(key) {
  const h = H();
  const data = loadData();
  const done = !!data.days[key];
  const skipped = !!data.skipped[key];
  const isToday = key === todayStr();

  const dateObj = new Date(key + 'T12:00:00');
  const dateLabel = dateObj.toLocaleDateString('en', { weekday: 'long', month: 'long', day: 'numeric' });

  let status = 'Not logged';
  if (done) status = h.statusDoneWord;
  if (skipped) status = h.statusSkipWord;

  const dayJournal = data.journal[key] || '';

  // Build popup
  const backdrop = document.createElement('div');
  backdrop.className = 'day-popup-backdrop';
  backdrop.onclick = (e) => { if (e.target === backdrop) { backdrop.remove(); render(); } };

  let btnsHtml = '';
  if (!done) {
    btnsHtml += `<button class="popup-btn tend" onclick="dayAction('${key}','tend')">${h.tendPopupLabel}</button>`;
  }
  if (!skipped) {
    btnsHtml += `<button class="popup-btn skip" onclick="dayAction('${key}','skip')">${h.skippedLabel}</button>`;
  }
  if (done || skipped) {
    btnsHtml += `<button class="popup-btn clear" onclick="dayAction('${key}','clear')">↩ Clear</button>`;
  }

  backdrop.innerHTML = `
    <div class="day-popup">
      <div class="popup-date">${dateLabel}</div>
      <div class="popup-status">Currently: ${status}</div>
      <div class="popup-btns">${btnsHtml}</div>
      <div style="margin-top: 16px; text-align: left;">
        <div class="journal-hint" style="margin-bottom: 6px; font-style: normal;">Reflection for this day</div>
        <textarea class="journal-textarea" style="min-height: 80px;" oninput="saveJournal(this.value, '${key}')">${dayJournal}</textarea>
      </div>
      <button class="popup-btn cancel" onclick="this.closest('.day-popup-backdrop').remove(); render();">Close</button>
    </div>
  `;

  document.body.appendChild(backdrop);
}

function dayAction(key, action) {
  const data = loadData();

  if (action === 'tend') {
    data.days[key] = true;
    delete data.skipped[key];
    saveData(data);
    fireConfetti();
  } else if (action === 'skip') {
    delete data.days[key];
    data.skipped[key] = true;
    saveData(data);
    fireWarning(calcStreak(data));
  } else if (action === 'clear') {
    delete data.days[key];
    delete data.skipped[key];
    saveData(data);
  }

  // Remove popup
  const backdrop = document.querySelector('.day-popup-backdrop');
  if (backdrop) backdrop.remove();

  render();
}

function changeMonth(dir) {
  const v = viewYM[activeHabit];
  v.m += dir;
  if (v.m > 11) { v.m = 0; v.y++; }
  if (v.m < 0) { v.m = 11; v.y--; }
  render();
}

function saveJournal(val, key) {
  const data = loadData();
  data.journal[key || todayStr()] = val;
  saveData(data);
}

// ─── INIT ───
render();
</script>

<!-- ══ SAFE AREA ════════════════════════════════════════════════════════════
     Every app declares apple-mobile-web-app-status-bar-style=black-translucent,
     which in an installed PWA makes the web view fill the WHOLE screen —
     including the strip behind the clock, signal and battery. Without a top
     inset the first row of UI sits underneath the status bar and can't be
     tapped, which is exactly what happened to the sub-tab strip.

     env(safe-area-inset-top) is 0 in a normal browser tab, so this is inert
     everywhere except the installed app, where it's ~47-59px. -->
<style id="safe-area-fix">
.app { padding-top: calc(20px + env(safe-area-inset-top, 0px)) !important; }
@media (max-width: 768px){ .app { padding-top: calc(24px + env(safe-area-inset-top, 0px)) !important; } }
@media (max-width: 480px){ .app { padding-top: calc(16px + env(safe-area-inset-top, 0px)) !important; } }
</style>
