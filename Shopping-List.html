<!-- PWA · same service-worker setup as the other trackers -->
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function (e) {
      console.warn('[pwa] service worker registration failed', e);
    });
  });
  var swHadController = !!navigator.serviceWorker.controller;
  var swLastInput = 0;
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) {
    addEventListener(t, function () { swLastInput = Date.now(); }, true);
  });
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'sw-updated' || !swHadController) return;
    var ae = document.activeElement;
    var typing = ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable);
    var busy = typing || (swLastInput && Date.now() - swLastInput < 30000);
    var last = 0; try { last = +sessionStorage.getItem('sw_reloaded_at') || 0; } catch (_) {}
    if (!busy && Date.now() - last > 15000) {
      try { sessionStorage.setItem('sw_reloaded_at', String(Date.now())); } catch (_) {}
      location.reload();
      return;
    }
    if (document.getElementById('sw-update-pill')) return;
    var b = document.createElement('button');
    b.id = 'sw-update-pill';
    b.type = 'button';
    b.textContent = '✨ Updated — tap to refresh';
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:2147483646;' +
      'padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(18,20,28,.94);color:#fff;' +
      'font:600 13px system-ui,-apple-system,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;';
    b.onclick = function () { location.reload(); };
    document.body.appendChild(b);
  });
}
</script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d12;
    --surface: #12151d;
    --surface2: #171b25;
    --border: #262b38;
    --text: #e7e9ee;
    --text-dim: #8b94a8;
    --text-faint: #565f74;
    --accent: #f2b84b;
    --accent-dim: #5c4a26;
    --accent-glow: rgba(242, 184, 75, 0.15);
    --good: #7fd99a;
    --good-dim: rgba(127, 217, 154, 0.12);
    --danger: #e2726f;
    --danger-dim: rgba(226, 114, 111, 0.12);
    --blue: #7fa1e0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .mono { font-family: 'DM Mono', ui-monospace, monospace; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 24px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 760px) {
    body {
      background:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(242,184,75,.05), transparent 60%),
        radial-gradient(ellipse 700px 600px at 100% 100%, rgba(127,217,154,.035), transparent 55%),
        var(--bg);
    }
    .app { max-width: 760px; padding-top: 56px; }
  }

  /* ── Header ──
     Switch App, Search, Sync and Alerts are baked in here, so hub-nav.js hides
     its floating pill on this page and sync/push skip their own fallbacks. */
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .header-icon {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--accent-glow); border: 1px solid var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .header-text { flex: 1; min-width: 0; }
  .header-text h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .header-text span { font-size: 12px; color: var(--text-faint); }
  .header-icons { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-chip {
    flex-shrink: 0; width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 50%; cursor: pointer; font-size: 13px;
  }
  .icon-chip:hover { color: var(--text); border-color: var(--accent-dim); }
  .tsync-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5568; flex-shrink: 0; }

  /* ── Tabs ── */
  .tabs {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px; margin-bottom: 16px;
  }
  .tab {
    background: none; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 4px; border-radius: 9px; cursor: pointer;
  }
  .tab.on { background: var(--surface2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }

  /* ── Cards & common bits ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  .section-label {
    font-size: 11px; font-weight: 700; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.07em;
    margin: 18px 0 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .link-btn {
    background: none; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
    text-transform: none; letter-spacing: normal; padding: 2px 4px;
  }
  .link-btn:hover { color: var(--accent); }
  .bar { height: 7px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 99px; background: var(--accent); transition: width .3s ease; }
  .bar.good > div { background: var(--good); }
  .bar.over > div { background: var(--danger); }
  .muted { color: var(--text-dim); }
  .faint { color: var(--text-faint); }

  .btn {
    background: var(--accent); color: #201404; border: none; border-radius: 10px;
    padding: 11px 18px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(226,114,111,.35); }

  input.field, select.field {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 12px; font-family: inherit; font-size: 14.5px; min-width: 0;
    color-scheme: dark;
  }
  input.field:focus, select.field:focus { outline: none; border-color: var(--accent-dim); }
  input.field::placeholder { color: var(--text-faint); }

  /* ── Today hero ── */
  .hero { text-align: center; padding: 22px 16px 18px; position: relative; overflow: hidden; }
  .hero::before {
    content: ''; position: absolute; inset: -40% -20% auto; height: 180px;
    background: radial-gradient(ellipse at center, var(--hero-glow, rgba(127,217,154,.14)), transparent 70%);
    pointer-events: none;
  }
  .hero-lbl { font-size: 12px; color: var(--text-dim); font-weight: 600; letter-spacing: .02em; position: relative; }
  .hero-num { font-size: 46px; font-weight: 700; letter-spacing: -0.03em; margin: 4px 0 2px; position: relative; }
  .hero-num.good { color: var(--good); }
  .hero-num.over { color: var(--danger); }
  .hero-sub { font-size: 12.5px; color: var(--text-dim); position: relative; line-height: 1.55; }
  .hero-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-top: 16px; position: relative;
  }
  .hs { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 6px; }
  .hs b { display: block; font-size: 15px; font-weight: 700; }
  .hs span { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }

  /* ── Usuals (one-tap expenses) ── */
  .usuals { display: flex; flex-wrap: wrap; gap: 8px; }
  .usual {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 8px 13px 8px 10px;
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    transition: transform .1s ease, border-color .15s ease;
  }
  .usual:active { transform: scale(0.95); }
  .usual .amt { color: var(--good); font-weight: 500; font-size: 12px; }
  .usual.logged { border-color: rgba(127,217,154,.4); background: var(--good-dim); }
  .usual.logged::after { content: '✓'; color: var(--good); font-size: 11px; }
  .usual .daily { font-size: 9.5px; color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 99px; padding: 0 5px; }
  .usual.add { color: var(--text-dim); border-style: dashed; padding: 8px 13px; }
  .hint { font-size: 11px; color: var(--text-faint); margin-top: 8px; }

  /* ── Quick add ── */
  .qa-row { display: flex; gap: 8px; }
  .qa-row .field { width: auto; flex: 1; }
  .qa-row .qa-amt { flex: 0 0 110px; width: 110px; font-size: 18px !important; font-weight: 700; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .cat {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 999px; padding: 6px 11px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .cat.on { color: var(--text); border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); }
  .qa-foot { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .qa-foot input[type=date] { flex: 1; }

  /* ── Rows (expenses & items) ── */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex; align-items: center; gap: 11px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .row.click { cursor: pointer; user-select: none; }
  .row.click:active { background: var(--surface2); }
  .row-ico {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent);
  }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; word-break: break-word; }
  .row-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }
  .row-amt { font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .x {
    background: none; border: none; color: var(--text-faint);
    font-size: 16px; line-height: 1; padding: 4px 6px; cursor: pointer; flex-shrink: 0;
  }
  .x:hover { color: var(--danger); }
  .day-head { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-dim); margin: 12px 2px 6px; font-weight: 600; }

  /* Shopping items */
  .add-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .add-extra { display: flex; gap: 8px; margin-bottom: 6px; }
  .kind-toggle {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 9px; padding: 0 12px; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .kind-toggle.wish { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-glow); }
  .add-extra input.field { padding: 9px 10px; font-size: 13px; }
  #addPrice { width: 84px; flex-shrink: 0; }
  .check {
    width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: transparent; transition: all .15s ease;
  }
  .row.done .check { background: var(--accent); border-color: var(--accent); color: #201404; }
  .row.done .row-title { color: var(--text-faint); text-decoration: line-through; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .badge {
    font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border);
  }
  .badge.price { color: var(--good); border-color: rgba(127,217,154,.3); background: var(--good-dim); }
  .badge.date { color: var(--blue); border-color: rgba(127,161,224,.3); background: rgba(127,161,224,.08); }
  .badge.date.overdue, .badge.nofit { color: var(--danger); border-color: rgba(226,114,111,.35); background: var(--danger-dim); }
  .badge.fit { color: var(--good); border-color: rgba(127,217,154,.3); background: var(--good-dim); }
  .badge.goal { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-glow); }
  .mini-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 5px 9px; font-family: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .mini-btn:hover { color: var(--accent); border-color: var(--accent-dim); }

  /* ── Goals ── */
  .goal-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .goal-name { font-size: 15px; font-weight: 700; }
  .goal-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .goal-nums { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 7px; }
  .goal-actions { display: flex; gap: 6px; margin-top: 12px; }
  .pool { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pool b { font-size: 22px; color: var(--good); }

  /* ── Emergency fund ── */
  .ef-card { border-color: rgba(127,161,224,.35); background: linear-gradient(160deg, rgba(127,161,224,.08), var(--surface) 60%); }
  .ef-ico { --c: #7fa1e0; width: 38px !important; height: 38px !important; font-size: 19px !important; }
  .ef-empty .btn { margin-top: 4px; }
  .bar.ef > div { background: var(--blue); }
  .ef-log { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .ef-log > div { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--text-dim); }
  .ef-prompt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; font-size: 13px;
    border-color: rgba(127,161,224,.35); }
  .ef-prompt .btn { padding: 8px 12px; font-size: 13px; background: var(--blue); color: #0b1020; white-space: nowrap; }

  /* ── Hero extras, one-line log, history ── */
  .hero-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; position: relative; flex-wrap: wrap; }
  .yday { font-size: 12px; margin-top: 10px; padding: 7px 10px; border-radius: 9px; position: relative; line-height: 1.45; }
  .yday.good { background: var(--good-dim); color: var(--good); }
  .yday.bad { background: var(--danger-dim); color: var(--danger); }
  .roll-card { display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 13px; border-color: rgba(127,217,154,.35); }
  .roll-card span { flex: 1; }
  .qa-row .btn { flex-shrink: 0; }
  .qa-preview { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; min-height: 18px; }
  .afford-out { margin-top: 14px; font-size: 13.5px; line-height: 1.5; color: var(--text-dim); }
  .afford-out p { margin-top: 6px; }
  .afford-verdict { font-size: 16px; font-weight: 700; padding: 10px 12px; border-radius: 10px; color: var(--text); }
  .afford-verdict.yes { background: var(--good-dim); color: var(--good); }
  .afford-verdict.maybe { background: var(--accent-glow); color: var(--accent); }
  .afford-verdict.no { background: var(--danger-dim); color: var(--danger); }
  .hist-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .month-switch { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .month-switch .mini-btn[disabled] { opacity: .35; cursor: default; }
  .hist-sum { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-dim); margin: 10px 2px 2px; }
  .leftover-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-dim); }
  .leftover-row .field { width: auto; max-width: 55%; padding: 7px 10px; font-size: 13px; }

  /* ── Insights ── */
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 6px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; }
  .chart .col > div { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
  .chart .col.over > div { background: var(--danger); }
  .chart .col.today > div { opacity: 1; box-shadow: 0 0 0 1px var(--text); }
  .chart .col.future > div { background: var(--surface2); }
  .chart-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--text-faint); pointer-events: none; }
  .chart-wrap { position: relative; }
  .chart-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-faint); margin-top: 5px; }
  .cat-line { margin-bottom: 11px; }
  .cat-line-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 11px; color: var(--text-faint); }

  .empty { text-align: center; padding: 26px 16px; color: var(--text-faint); font-size: 13px; line-height: 1.6; }

  /* ── Sheet (modal) ── */
  .sheet-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 99990;
    display: flex; align-items: flex-end; justify-content: center;
    animation: fade .15s ease;
  }
  @media (min-width: 600px) { .sheet-bg { align-items: center; } }
  .sheet {
    width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px 18px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    animation: up .2s ease;
  }
  @media (min-width: 600px) { .sheet { border-radius: 18px; } }
  .sheet h3 { font-size: 17px; margin-bottom: 4px; }
  .sheet p.sd { font-size: 12.5px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5; }
  .sheet label { display: block; font-size: 11.5px; color: var(--text-dim); font-weight: 600; margin: 10px 0 5px; }
  .sheet .toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13.5px; cursor: pointer; }
  .sheet .toggle-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 18px; }
  .sheet-actions .btn { flex: 1; }
  .sheet-actions .btn.danger { flex: 0 0 auto; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }

  #toast-host {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); z-index: 999999;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .toast {
    background: rgba(23, 27, 37, 0.97); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 10px; font-size: 12.5px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: up .2s ease; max-width: 92vw;
  }
  .toast button { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 12.5px; cursor: pointer; white-space: nowrap; }

  @media (max-width: 420px) {
    .header-text h1 { font-size: 17px; }
    .hero-num { font-size: 40px; }
    .tab { font-size: 12px; }
    .qa-row .qa-amt { flex-basis: 96px; width: 96px; }
  }
</style>

<body>

<div class="app" id="app"></div>
<div id="toast-host"></div>

<script>
// ═══════════════════════════ DATA ═══════════════════════════
// shopping_list_v1 keeps its shape because Study todos and the Hub read it.
const SHOP_KEY = 'shopping_list_v1';
const BUDGET_KEY = 'budget_v1';
const TAB_KEY = 'budget_tab';

const CATS = [
  { id: 'food',     icon: '🍱', label: 'Food',     c: '#f2b84b' },
  { id: 'travel',   icon: '🛺', label: 'Travel',   c: '#7fa1e0' },
  { id: 'shopping', icon: '🛍️', label: 'Shopping', c: '#d98fd0' },
  { id: 'fun',      icon: '🎮', label: 'Fun',      c: '#7fd99a' },
  { id: 'bills',    icon: '📱', label: 'Bills',    c: '#e2726f' },
  { id: 'other',    icon: '💸', label: 'Other',    c: '#8b94a8' },
];
const catOf = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function localDate(d) {
  const dt = d || new Date();
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
const monthKey = (ds) => (ds || localDate()).slice(0, 7);
function fmtDate(s) { return new Date(s + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }
function fmtDay(s) {
  const t = localDate(), y = localDate(new Date(Date.now() - 864e5));
  if (s === t) return 'Today';
  if (s === y) return 'Yesterday';
  return new Date(s + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
}
function money(n) {
  const neg = n < 0; n = Math.abs(Math.round(n * 100) / 100);
  const s = n.toLocaleString('en-IN', { maximumFractionDigits: n % 1 ? 2 : 0 });
  return (neg ? '−₹' : '₹') + s;
}
function num(v) { const n = parseFloat(v); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : null; }

function loadShop() {
  try { const d = JSON.parse(localStorage.getItem(SHOP_KEY)); return Array.isArray(d) ? d : []; } catch (_) { return []; }
}
function saveShop(items) { localStorage.setItem(SHOP_KEY, JSON.stringify(items)); }

function blankBudget() {
  return { months: {}, savePct: 20, expenses: [], usuals: [], goals: [], subs: [], incomes: [], owed: [], limits: {},
           rolled: {}, leftoverTo: 'savings', savedOut: 0, migrated: false };
}
function loadBudget() {
  let b;
  try { b = JSON.parse(localStorage.getItem(BUDGET_KEY)); } catch (_) {}
  b = Object.assign(blankBudget(), b && typeof b === 'object' ? b : {});
  return b;
}
function saveBudget(b) { localStorage.setItem(BUDGET_KEY, JSON.stringify(b)); }

// ═══════════════════════ SHOPPING ↔ EXPENSES ═══════════════════════
// A bought shopping item with a price becomes a Shopping expense, and un-ticking
// it removes that expense. This runs on every render, so ticks made from Study
// todos on another device get logged too. Items already bought before the
// budget existed are marked once and never logged.
function reconcileShop() {
  const b = loadBudget(), items = loadShop();
  let bChanged = false, sChanged = false;

  if (!b.migrated) {
    items.forEach(it => { if (it.done && !it.expenseId) { it.expenseId = 'pre'; sChanged = true; } });
    b.migrated = true; bChanged = true;
  }

  items.forEach(it => {
    if (it.done && it.price != null && !it.expenseId) {
      const e = { id: uid(), amt: it.price, cat: 'shopping', note: it.text, date: localDate(), ts: Date.now(), shopId: it.id };
      b.expenses.push(e);
      it.expenseId = e.id; bChanged = sChanged = true;
    } else if (!it.done && it.expenseId) {
      if (it.expenseId !== 'pre') b.expenses = b.expenses.filter(e => e.id !== it.expenseId);
      delete it.expenseId; bChanged = sChanged = true;
    }
  });

  if (sChanged) saveShop(items);
  if (bChanged) saveBudget(b);
}

// ═══════════════════════════ MATH ═══════════════════════════
// Pay yourself first. Savings come off the month's money up front, and what's
// left is spread across the remaining days. Daily usuals (lunch, chai) are
// reserved for every remaining day, so "free today" is money you can actually use.
function monthPlan(b, ym) {
  const m = b.months[ym];
  if (!m || !m.income) return null;
  const pct = m.savePct != null ? m.savePct : b.savePct;
  const save = Math.round(m.income * pct / 100);
  const topUp = m.topUp || 0;
  const extra = (b.incomes || []).filter(x => !x.toSavings && monthKey(x.date) === ym).reduce((s, x) => s + x.amt, 0);
  return { income: m.income, pct, save, topUp, extra, spendable: m.income - save + topUp + extra };
}

// ═══════════════════════ MONTH-END LEFTOVER ═══════════════════════
// When a month ends, whatever wasn't spent moves to savings, or into the goal
// you picked. Each month rolls over once, and the amount is fixed from then on.
function applyRollover() {
  const b = loadBudget(), cur = monthKey();
  b.rolled = b.rolled || {};
  let changed = false, notice = null;
  Object.keys(b.months).sort().forEach(ym => {
    if (ym >= cur || ym in b.rolled) return;
    const p = monthPlan(b, ym);
    if (!p) return;
    const spent = b.expenses.filter(e => monthKey(e.date) === ym).reduce((s, e) => s + e.amt, 0);
    const amt = Math.max(0, Math.round(p.spendable - spent));
    b.rolled[ym] = amt;
    changed = true;
    let to = 'savings';
    const g = amt && b.leftoverTo !== 'savings' && b.goals.find(x => x.id === b.leftoverTo);
    if (g) {
      const put = Math.min(amt, Math.max(0, g.target - (g.saved || 0)));
      g.saved = (g.saved || 0) + put;
      if (put) to = g.id;
    }
    notice = { ym, amt, to };
  });
  if (notice) b.rollNotice = notice;
  if (changed) saveBudget(b);
}

// ═══════════════════════ SUBSCRIPTIONS ═══════════════════════
// A subscription is charged once a month on its day. On or after that day the
// charge is logged by itself, and until then it is set aside from this month's money.
function subDue(sub, ym) {
  const [y, m] = ym.split('-').map(Number);
  const dim = new Date(y, m, 0).getDate();
  return ym + '-' + String(Math.min(sub.day, dim)).padStart(2, '0');
}
const subPaid = (b, sub, ym) => b.expenses.some(e => e.subId === sub.id && e.subYM === ym);
const subSkipped = (sub, ym) => !!(sub.skip && sub.skip[ym]);
const subLive = (sub, ym) => !sub.paused && ym >= sub.startYM && subInMonth(sub, ym);
// A yearly subscription is only charged in its own month
const subInMonth = (sub, ym) => sub.every !== 'year' || +ym.slice(5) === +sub.startYM.slice(5);
function subNextDue(sub, ym) {
  let y = ym;
  for (let i = 0; i < 13; i++) { if (y >= sub.startYM && subInMonth(sub, y)) return subDue(sub, y); y = nextYM(y); }
  return subDue(sub, sub.startYM);
}

function nextYM(ym) {
  const [y, m] = ym.split('-').map(Number);
  return m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0');
}

// Log every charge that has come due, catching up months the app wasn't opened
function applySubs() {
  const b = loadBudget();
  if (!b.subs || !b.subs.length) return;
  const today = localDate(), cur = monthKey(today);
  let changed = false;
  b.subs.forEach(sub => {
    if (sub.paused) return;
    let ym = sub.startYM, guard = 0;
    while (ym <= cur && guard++ < 36) {
      const due = subDue(sub, ym);
      if (subInMonth(sub, ym) && due <= today && !subPaid(b, sub, ym) && !subSkipped(sub, ym)) {
        b.expenses.push({ id: uid(), amt: sub.amt, cat: sub.cat, note: sub.name, date: due,
                          ts: new Date(due + 'T09:00:00').getTime(), subId: sub.id, subYM: ym });
        changed = true;
      }
      ym = nextYM(ym);
    }
  });
  if (changed) saveBudget(b);
}

// Charges still to come this month, which "free today" has to leave room for
function subsAhead(b, ym, today) {
  return (b.subs || []).filter(sub => subLive(sub, ym) && !subPaid(b, sub, ym) && !subSkipped(sub, ym) && subDue(sub, ym) > today);
}

function calc(b) {
  const today = localDate(), ym = monthKey(today);
  const now = new Date();
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const daysLeft = dim - now.getDate() + 1;
  const plan = monthPlan(b, ym);

  const monthExp = b.expenses.filter(e => monthKey(e.date) === ym);
  const spent = monthExp.reduce((s, e) => s + e.amt, 0);
  const todayExp = monthExp.filter(e => e.date === today);
  const spentToday = todayExp.reduce((s, e) => s + e.amt, 0);

  const daily = b.usuals.filter(u => u.daily);
  const fixedPerDay = daily.reduce((s, u) => s + u.amt, 0);
  // Money already spent today on each daily usual, capped at its planned amount
  const fixedSpentToday = daily.reduce((s, u) => {
    const got = todayExp.filter(e => e.usualId === u.id).reduce((a, e) => a + e.amt, 0);
    return s + Math.min(got, u.amt);
  }, 0);

  if (!plan) return { today, ym, dim, daysLeft, plan: null, spent, spentToday, monthExp, fixedPerDay };

  const bills = subsAhead(b, ym, today);
  const billsAhead = bills.reduce((s, x) => s + x.amt, 0);

  const lent = (b.owed || []).filter(o => !o.paid).reduce((s, o) => s + o.amt, 0);
  const left = plan.spendable - spent - lent;
  const startOfToday = left + spentToday;
  const flexPerDay = (startOfToday - fixedPerDay * daysLeft - billsAhead) / daysLeft;
  const freeToday = flexPerDay - (spentToday - fixedSpentToday);
  const reservedAhead = fixedPerDay * (daysLeft - 1) + (fixedPerDay - fixedSpentToday) + billsAhead;
  const freeMonth = left - reservedAhead;

  return { today, ym, dim, daysLeft, plan, spent, spentToday, monthExp, left, flexPerDay, freeToday, freeMonth, fixedPerDay, fixedSpentToday, bills, billsAhead, lent,
           yesterday: yesterdayResult(b, plan, ym, dim, daily, fixedPerDay) };
}

// How yesterday went against the allowance it started with. Only within this month,
// and only when something was logged that day.
function yesterdayResult(b, plan, ym, dim, daily, fixedPerDay) {
  const y = localDate(new Date(Date.now() - 864e5));
  if (monthKey(y) !== ym) return null;
  const dayN = +y.slice(8), daysLeftY = dim - dayN + 1;
  const before = b.expenses.filter(e => monthKey(e.date) === ym && e.date < y).reduce((s, e) => s + e.amt, 0);
  const yExp = b.expenses.filter(e => e.date === y);
  const spentY = yExp.reduce((s, e) => s + e.amt, 0);
  if (!yExp.length) return null;     // nothing logged is more likely forgotten than saved
  const billsY = (b.subs || []).filter(sub => subLive(sub, ym) && !subSkipped(sub, ym) && subDue(sub, ym) > y).reduce((s, x) => s + x.amt, 0);
  const fixedY = daily.reduce((s, u) => s + Math.min(u.amt, yExp.filter(e => e.usualId === u.id).reduce((a, e) => a + e.amt, 0)), 0);
  const billsPaidY = yExp.filter(e => e.subId).reduce((s, e) => s + e.amt, 0);
  const allowance = (plan.spendable - before - fixedPerDay * daysLeftY - billsY) / daysLeftY;
  if (!(allowance > 0)) return null;
  const flexSpent = spentY - fixedY - billsPaidY;
  return { allowance, diff: Math.round(allowance - flexSpent) };
}

// Everything set aside so far: each month's savings, minus what went into goals
function savingsPool(b) {
  const total = Object.keys(b.months).filter(ym => ym <= monthKey()).reduce((s, ym) => {
    const p = monthPlan(b, ym); return s + (p ? p.save : 0);
  }, 0);
  const rolled = Object.values(b.rolled || {}).reduce((s, x) => s + x, 0);
  const saved = (b.incomes || []).filter(x => x.toSavings && monthKey(x.date) <= monthKey()).reduce((s, x) => s + x.amt, 0);
  const inGoals = b.goals.reduce((s, g) => s + (g.saved || 0), 0);
  const inEF = efDeposits(b);
  return { total: total + rolled + saved, rolled, inGoals, inEF, free: total + rolled + saved - inGoals - inEF - (b.savedOut || 0) };
}

// ═══════════════════════ EMERGENCY FUND ═══════════════════════
// A ledger of deposits (+) and uses (−). Money taken out tops up that month's
// budget, so an emergency doesn't eat into your daily spending money.
const EF_BLANK = { months: 3, custom: null, autoPct: 50, log: [] };
const efOn = b => !!b.ef;
const efBalance = b => efOn(b) ? b.ef.log.reduce((s, x) => s + x.amt, 0) : 0;
const efDeposits = b => efOn(b) ? b.ef.log.filter(x => x.amt > 0).reduce((s, x) => s + x.amt, 0) : 0;

// Average spend of up to three past months, or this month's plan when there's no history yet
function efMonthlyBase(b) {
  const ym = monthKey();
  const totals = {};
  b.expenses.forEach(e => { const m = monthKey(e.date); if (m < ym) totals[m] = (totals[m] || 0) + e.amt; });
  const past = Object.keys(totals).sort().slice(-3);
  if (past.length) return past.reduce((s, m) => s + totals[m], 0) / past.length;
  const p = monthPlan(b, ym);
  return p ? p.income - p.save : 0;
}
function efTarget(b) {
  if (!efOn(b)) return 0;
  if (b.ef.custom) return b.ef.custom;
  return Math.ceil(efMonthlyBase(b) * b.ef.months / 100) * 100;
}

// This month's automatic deposit: autoPct of the month's savings, capped at what the fund still needs
function applyAutoEF() {
  const b = loadBudget();
  if (!efOn(b)) return;
  const ym = monthKey(), p = monthPlan(b, ym);
  const idx = b.ef.log.findIndex(x => x.kind === 'auto' && x.ym === ym);
  const cur = idx === -1 ? 0 : b.ef.log[idx].amt;
  let want = 0;
  if (p && b.ef.autoPct > 0) {
    const room = Math.max(0, efTarget(b) - (efBalance(b) - cur));
    const free = savingsPool(b).free + cur;
    want = Math.max(0, Math.min(Math.round(p.save * b.ef.autoPct / 100), room, free));
  }
  if (want === cur) return;
  if (idx === -1) b.ef.log.push({ id: uid(), amt: want, kind: 'auto', ym, date: localDate(), note: 'Auto from savings' });
  else if (want) b.ef.log[idx].amt = want;
  else b.ef.log.splice(idx, 1);
  saveBudget(b);
}

function editEF() {
  const b = loadBudget(), ef = b.ef || EF_BLANK;
  const base = efMonthlyBase(b);
  const opt = m => `<option value="${m}"${!ef.custom && ef.months === m ? ' selected' : ''}>${m} month${m === 1 ? '' : 's'} of spending${base ? ' · ' + money(Math.ceil(base * m / 100) * 100) : ''}</option>`;
  openSheet({
    title: efOn(b) ? 'Emergency fund settings' : '🛟 Start an emergency fund',
    desc: 'Money you keep for surprises, like a broken phone, a doctor visit or a trip home. You only touch it in a real emergency. Most people aim for 3 months of their normal spending.',
    body: `
      <label>Target</label>
      <select class="field" name="months" onchange="this.form.custom.parentElement.style.display = this.value === 'custom' ? '' : 'none'">
        ${[1, 3, 6].map(opt).join('')}
        <option value="custom"${ef.custom ? ' selected' : ''}>Custom amount</option>
      </select>
      <div style="display:${ef.custom ? '' : 'none'}"><label>Custom target (₹)</label>
        <input class="field mono" name="custom" type="number" inputmode="decimal" min="0" step="100" value="${ef.custom || ''}"></div>
      <label>Put this % of each month's savings in first</label>
      <input class="field mono" name="auto" type="number" inputmode="numeric" min="0" max="100" step="5" value="${ef.autoPct}">
      <p class="hint">${base ? `Based on about ${money(base)} of spending a month.` : 'Set this month\'s money on Today to size the target.'} Auto-saving stops once the fund is full, and the rest of your savings go to goals.</p>`,
    saveLabel: efOn(b) ? 'Save' : 'Start fund',
    onSave: f => {
      const custom = f.months.value === 'custom' ? num(f.custom.value) : null;
      if (f.months.value === 'custom' && !custom) { f.custom.focus(); return false; }
      const bb = loadBudget();
      bb.ef = Object.assign({}, EF_BLANK, bb.ef || {}, {
        months: custom ? (bb.ef ? bb.ef.months : 3) : +f.months.value,
        custom,
        autoPct: Math.max(0, Math.min(100, parseInt(f.auto.value, 10) || 0)),
      });
      saveBudget(bb); refresh();
    },
    onDelete: efOn(b) ? () => {
      if (!confirm('Close the emergency fund?\n\nIts balance goes back to your free savings.')) return;
      const bb = loadBudget(); delete bb.ef; saveBudget(bb); refresh();
    } : null
  });
}

function addToEF() {
  const b = loadBudget(), pool = savingsPool(b), need = Math.max(0, efTarget(b) - efBalance(b));
  openSheet({
    title: '🛟 Add to emergency fund',
    desc: `You have ${money(pool.free)} of savings not in a goal.${need ? ` ${money(need)} more fills the fund.` : ''}`,
    body: `<input class="field mono" name="amt" type="number" inputmode="decimal" min="0" step="1" value="${Math.round(Math.max(0, Math.min(need, pool.free))) || ''}" placeholder="₹">`,
    saveLabel: 'Add',
    onSave: f => {
      const amt = num(f.amt.value);
      if (!amt) { f.amt.focus(); return false; }
      const bb = loadBudget();
      bb.ef.log.push({ id: uid(), amt, kind: 'add', date: localDate(), note: 'Added' });
      saveBudget(bb); render();
    }
  });
}

// Taking money out adds it to this month's budget. Logging the emergency as an
// expense in the same step leaves "free today" where it was.
function useEF(prefill, alreadyLogged) {
  const b = loadBudget(), bal = efBalance(b);
  if (bal <= 0) { showToast('The emergency fund is empty'); return; }
  openSheet({
    title: '🛟 Use emergency fund',
    desc: `${money(bal)} available. The money is added to this month's budget.`,
    body: `
      <label>Amount (₹)</label>
      <input class="field mono" name="amt" type="number" inputmode="decimal" min="0" max="${bal}" step="1" value="${prefill ? Math.round(Math.min(prefill, bal)) : ''}" required>
      <label>What happened?</label>
      <input class="field" name="note" placeholder="e.g. Phone screen repair" maxlength="60" value="${alreadyLogged ? 'Covered overspending' : ''}">
      <label class="toggle-row"><input type="checkbox" name="log"${alreadyLogged ? '' : ' checked'} onchange="this.form.cat.parentElement.style.display = this.checked ? '' : 'none'"> Also log it as an expense</label>
      <div style="${alreadyLogged ? 'display:none' : ''}"><label>Category</label>${catSelect('other')}</div>
      <p class="hint">Untick this if you already logged the spending and only need to cover it.</p>`,
    saveLabel: 'Use it',
    onSave: f => {
      const amt = num(f.amt.value);
      if (!amt || amt > bal) { f.amt.focus(); return false; }
      const note = f.note.value.trim() || 'Emergency';
      const bb = loadBudget(), ym = monthKey();
      bb.ef.log.push({ id: uid(), amt: -amt, kind: 'use', date: localDate(), note });
      bb.months[ym] = Object.assign({}, bb.months[ym], { topUp: ((bb.months[ym] || {}).topUp || 0) + amt });
      if (f.log.checked) bb.expenses.push({ id: uid(), amt, cat: f.cat.value, note, date: localDate(), ts: Date.now(), fromEF: true });
      saveBudget(bb); render();
      showToast(`🛟 ${money(amt)} moved into this month`);
    }
  });
}

function monthsUntil(dateStr) {
  const now = new Date(), d = new Date(dateStr + 'T12:00:00');
  return Math.max(1, (d.getFullYear() - now.getFullYear()) * 12 + (d.getMonth() - now.getMonth()));
}

// ═══════════════════════════ UI HELPERS ═══════════════════════════
function showToast(message, action, ms) {
  const host = document.getElementById('toast-host');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${message}</span>` + (action ? `<button type="button">${action.label}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { action.fn(); t.remove(); };
  host.appendChild(t);
  setTimeout(() => t.remove(), ms || (action ? 5000 : 2200));
}

// A bottom sheet with a form. onSave gets the form element and returns false to stay open.
function openSheet({ title, desc, body, saveLabel, onSave, onDelete }) {
  closeSheet();
  const bg = document.createElement('div');
  bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.innerHTML = `
    <form class="sheet" autocomplete="off">
      <h3>${title}</h3>
      ${desc ? `<p class="sd">${desc}</p>` : ''}
      ${body}
      <div class="sheet-actions">
        ${onDelete ? '<button type="button" class="btn danger" data-del>Delete</button>' : ''}
        <button type="button" class="btn ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">${saveLabel || 'Save'}</button>
      </div>
    </form>`;
  const form = bg.querySelector('form');
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  bg.querySelector('[data-cancel]').onclick = closeSheet;
  if (onDelete) bg.querySelector('[data-del]').onclick = () => { onDelete(); closeSheet(); };
  form.onsubmit = e => { e.preventDefault(); if (onSave(form) !== false) closeSheet(); };
  document.body.appendChild(bg);
  const first = form.querySelector('input, select');
  if (first && matchMedia('(pointer:fine)').matches) first.focus();
}
function closeSheet() { const s = document.getElementById('sheet'); if (s) s.remove(); }

function catSelect(sel) {
  return `<select class="field" name="cat">${CATS.map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${c.icon} ${c.label}</option>`).join('')}</select>`;
}

// ═══════════════════════════ STATE ═══════════════════════════
let tab = 'today';
try { tab = localStorage.getItem(TAB_KEY) || 'today'; } catch (_) {}
if (!['today', 'list', 'goals', 'insights', 'history'].includes(tab)) tab = 'today';
let qaCat = null;          // a category you tapped yourself; otherwise it's guessed from what you type
let addKind = 'shop';

function setTab(t) {
  tab = t;
  try { localStorage.setItem(TAB_KEY, t); } catch (_) {}
  render();
  window.scrollTo({ top: 0 });
}

// ═══════════════════════════ ACTIONS · MONEY ═══════════════════════════
function editMonth() {
  const b = loadBudget(), ym = monthKey();
  const cur = b.months[ym] || {};
  // New month: prefill from the most recent month you set up
  const prev = Object.keys(b.months).filter(k => k < ym).sort().pop();
  const income = cur.income || (prev && b.months[prev].income) || '';
  const pct = cur.savePct != null ? cur.savePct : b.savePct;
  const monthName = new Date().toLocaleDateString('en-IN', { month: 'long' });
  openSheet({
    title: `${monthName} money`,
    desc: 'Enter everything you have to spend this month (pocket money, salary, etc.). Your savings come off first, and the rest is spread over the days left.',
    body: `
      <label>Money for ${monthName} (₹)</label>
      <input class="field mono" name="income" type="number" inputmode="decimal" min="0" step="1" value="${income}" placeholder="e.g. 8000" required>
      <label>Save first (%)</label>
      <input class="field mono" name="pct" type="number" inputmode="numeric" min="0" max="90" step="1" value="${pct}">
      <p class="hint">20% is a common starting point. Even 10% adds up.</p>`,
    onSave: f => {
      const inc = num(f.income.value);
      if (!inc) { f.income.focus(); return false; }
      const p = Math.max(0, Math.min(90, parseInt(f.pct.value, 10) || 0));
      const bb = loadBudget();
      bb.months[ym] = Object.assign({}, bb.months[ym], { income: inc, savePct: p });
      bb.savePct = p;
      saveBudget(bb); refresh();
    }
  });
}

function addExpense(amt, cat, note, date, extra) {
  const b = loadBudget();
  const e = Object.assign({ id: uid(), amt, cat, note: (note || '').trim(), date: date || localDate(), ts: Date.now() }, extra || {});
  b.expenses.push(e);
  saveBudget(b);
  render();
  return e;
}

function deleteExpense(id) {
  const b = loadBudget();
  const idx = b.expenses.findIndex(e => e.id === id);
  if (idx === -1) return;
  const [removed] = b.expenses.splice(idx, 1);
  // A removed subscription charge stays removed for that month
  const sub = removed.subId && (b.subs || []).find(x => x.id === removed.subId);
  if (sub) sub.skip = Object.assign({}, sub.skip, { [removed.subYM]: true });
  const ious = (b.owed || []).filter(o => o.expId === removed.id);
  if (ious.length) b.owed = b.owed.filter(o => o.expId !== removed.id);
  saveBudget(b);
  // A bought shopping item goes back on the list when its expense is removed
  if (removed.shopId) {
    const items = loadShop(), it = items.find(i => i.id === removed.shopId);
    if (it) { it.done = false; delete it.expenseId; saveShop(items); }
  }
  render();
  showToast(`Removed ${money(removed.amt)}${removed.note ? ' · ' + escapeHtml(removed.note) : ''}`, { label: 'Undo', fn: () => {
    const bb = loadBudget(); bb.expenses.push(removed);
    const s2 = removed.subId && (bb.subs || []).find(x => x.id === removed.subId);
    if (s2 && s2.skip) delete s2.skip[removed.subYM];
    if (ious.length) bb.owed = (bb.owed || []).concat(ious);
    saveBudget(bb);
    if (removed.shopId) {
      const items = loadShop(), it = items.find(i => i.id === removed.shopId);
      if (it) { it.done = true; it.expenseId = removed.id; saveShop(items); }
    }
    render();
  } });
}

function deleteExpenseSilently(id) {
  const b = loadBudget(); b.expenses = b.expenses.filter(e => e.id !== id); saveBudget(b); render();
}

// Three of the same note at the same price means it's a habit, so offer a one-tap button
function maybeSuggestUsual(e) {
  if (!e.note) return;
  const b = loadBudget(), key = e.note.toLowerCase();
  if (b.usuals.some(u => u.name.toLowerCase() === key)) return;
  if ((b.dismissedUsuals || []).includes(key)) return;
  const same = b.expenses.filter(x => !x.usualId && (x.note || '').toLowerCase() === key && x.amt === e.amt).length;
  if (same < 3) return;
  setTimeout(() => showToast(`You've logged "${escapeHtml(e.note)}" ${same}× — save it as a one-tap usual?`, {
    label: 'Save', fn: () => editUsual(null, { name: e.note, amt: e.amt, cat: e.cat })
  }, 8000), 400);
  b.dismissedUsuals = (b.dismissedUsuals || []).concat(key);
  saveBudget(b);
}

function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function moveToGoal(id, dir) {
  const b = loadBudget(), g = b.goals.find(x => x.id === id);
  if (!g) return;
  const pool = savingsPool(b);
  const need = Math.max(0, g.target - (g.saved || 0));
  const suggest = dir > 0 ? Math.min(need, Math.max(0, pool.free)) : (g.saved || 0);
  openSheet({
    title: dir > 0 ? `Add to ${escapeHtml(g.name)}` : `Take from ${escapeHtml(g.name)}`,
    desc: dir > 0
      ? `You have ${money(pool.free)} of savings not yet in a goal. ${money(need)} more reaches this goal.`
      : `${money(g.saved || 0)} is in this goal. Taking money out returns it to your free savings.`,
    body: `<input class="field mono" name="amt" type="number" inputmode="decimal" min="0" step="1" value="${suggest > 0 ? Math.round(suggest) : ''}" placeholder="₹">`,
    saveLabel: dir > 0 ? 'Add' : 'Take out',
    onSave: f => {
      const amt = num(f.amt.value);
      if (!amt) { f.amt.focus(); return false; }
      const bb = loadBudget(), gg = bb.goals.find(x => x.id === id);
      gg.saved = Math.max(0, (gg.saved || 0) + dir * amt);
      saveBudget(bb); render();
      if (dir > 0 && gg.saved >= gg.target) showToast(`🎉 ${escapeHtml(gg.name)} is fully saved!`, null, 3500);
    }
  });
}
// Spending a finished goal logs it as an expense paid from savings, not from this month's money
function completeGoal(id) {
  const b = loadBudget(), g = b.goals.find(x => x.id === id);
  if (!g) return;
  if (!confirm(`Mark "${g.name}" as bought?\n\nIts ${money(g.saved || 0)} leaves your savings and the goal is removed. This month's spending money isn't touched.`)) return;
  b.savedOut = (b.savedOut || 0) + (g.saved || 0);
  b.goals = b.goals.filter(x => x.id !== id);
  (b.history = b.history || []).push({ name: g.name, amt: g.saved || 0, date: localDate() });
  saveBudget(b);
  if (g.wishId) {
    const items = loadShop(), it = items.find(i => i.id === g.wishId);
    if (it) { it.done = true; it.expenseId = 'goal'; saveShop(items); }
  }
  render();
  showToast(`🎉 Bought ${escapeHtml(g.name)} with your savings`, null, 3500);
}
function wishToGoal(itemId) {
  const it = loadShop().find(i => i.id === itemId);
  if (!it) return;
  const b = loadBudget();
  if (b.goals.some(g => g.wishId === itemId)) { setTab('goals'); return; }
  editGoal(null, { name: it.text, target: it.price || '', date: it.date || '', emoji: '⭐', wishId: itemId });

// Type "chai 20" or "80 lunch". The amount and note are read from the line and

function readQuick() {
  const el = document.getElementById('qaText');
  return el ? window.BudgetCore.parseEntry(el.value, loadBudget().expenses) : null;
}

function previewQuick() {
  const p = readQuick(), out = document.getElementById('qaPreview');
  if (!out) return;
  const cat = qaCat || (p && p.cat) || 'other';
  document.querySelectorAll('#qaCats .cat').forEach(x => x.classList.toggle('on', x.dataset.cat === cat));
  if (!p || (!p.amt && !p.note)) { out.innerHTML = '<span class="faint">Try <b>chai 20</b>, <b>80 lunch</b> or <b>dinner 600 split 3</b></span>'; return; }
  const c = catOf(cat);
  out.innerHTML = p.amt
    ? `<b class="mono">${money(p.amt)}</b> · ${c.icon} ${c.label}${p.note ? ' · ' + escapeHtml(p.note) : ''}${p.split ? ` · 👥 your share ${money(p.amt / p.split)}` : ''}`
    : '<span style="color:var(--danger)">Add an amount, like chai 20</span>';
}

function pickQuickCat(cat) { qaCat = qaCat === cat ? null : cat; previewQuick(); }

function submitQuick() {
  const p = readQuick(), input = document.getElementById('qaText');
  if (!p || !p.amt) { if (input) input.focus(); previewQuick(); return; }
  const cat = qaCat || p.cat || 'other';
  const d = document.getElementById('qaDate');
  const date = (d && d.value) || localDate();
  if (p.split) { openSplit({ total: p.amt, note: p.note, cat, people: p.split, date }); return; }
  const e = addExpense(p.amt, cat, p.note, date);
  maybeSuggestUsual(e);
  showToast(`Logged ${money(p.amt)} · ${catOf(cat).label}`, { label: 'Undo', fn: () => deleteExpenseSilently(e.id) });
  checkAlerts();
  qaCat = null;
  const again = document.getElementById('qaText');
  if (again) { again.value = ''; if (matchMedia('(pointer:fine)').matches) again.focus(); }
  previewQuick();
}

// ═══════════════════════════ ALERTS ═══════════════════════════
// Once per month each: 80% and 100% of the month, and of any category limit
function checkAlerts() {
  const b = loadBudget(), k = calc(b);
  if (!k.plan) return;
  b.alerted = b.alerted || {};
  const seen = b.alerted[k.ym] = b.alerted[k.ym] || {};
  const say = [];
  const pct = (k.spent + k.lent) / Math.max(1, k.plan.spendable);
  if (pct >= 1 && !seen.m100) { seen.m100 = seen.m80 = 1; say.push(`You've used all of this month's money`); }
  else if (pct >= .8 && !seen.m80) { seen.m80 = 1; say.push(`80% of this month's money is gone · ${money(k.left)} left`); }
  Object.entries(b.limits || {}).forEach(([cat, lim]) => {
    if (!(lim > 0)) return;
    const used = k.monthExp.filter(e => e.cat === cat).reduce((s, e) => s + e.amt, 0), c = catOf(cat);
    if (used >= lim && !seen['c100' + cat]) { seen['c100' + cat] = seen['c80' + cat] = 1; say.push(`${c.icon} ${c.label} is over its ${money(lim)} limit`); }
    else if (used >= lim * .8 && !seen['c80' + cat]) { seen['c80' + cat] = 1; say.push(`${c.icon} ${c.label}: ${money(used)} of ${money(lim)} used`); }
  });
  if (!say.length) return;
  saveBudget(b);
  setTimeout(() => say.forEach((m, i) => setTimeout(() => showToast('⚠️ ' + m, null, 4000), i * 600)), 900);
}

// You paid the whole bill. Your share is spending, and each friend's share is

function openSplit(preset) {
  const p = Object.assign({ total: '', note: '', cat: 'food', people: 2, date: localDate() }, preset || {});
  openSheet({
    title: '👥 Split a bill',
    desc: 'You paid the whole bill. Your share counts as spending, and the rest is tracked until your friends pay you back.',
    body: `
      <div style="display:flex;gap:8px">
        <div style="flex:1"><label>Total bill (₹)</label><input class="field mono" name="total" type="number" inputmode="decimal" min="0" step="1" value="${p.total}" required oninput="splitPreview(this.form)"></div>
        <div style="width:110px"><label>People, incl. you</label><input class="field mono" name="people" type="number" inputmode="numeric" min="2" max="20" step="1" value="${p.people}" oninput="splitPreview(this.form)"></div>
      </div>

      const total = num(f.total.value), n = Math.max(2, Math.min(20, parseInt(f.people.value, 10) || 2));
      if (!total) { f.total.focus(); return false; }
      const share = Math.round(total / n * 100) / 100, note = f.note.value.trim() || 'Split bill';
      const names = f.names.value.split(',').map(x => x.trim()).filter(Boolean);
      const e = addExpense(share, f.cat.value, `${note} · split ${n}`, f.date.value || localDate(), { split: n });
      const bb = loadBudget(); bb.owed = bb.owed || [];
      for (let i = 0; i < n - 1; i++) bb.owed.push({ id: uid(), name: names[i] || `Friend ${i + 1}`, amt: share, note, date: e.date, expId: e.id, paid: false });
      saveBudget(bb); render(); checkAlerts();
      const q = document.getElementById('qaText'); if (q) q.value = '';
      showToast(`👥 Your share ${money(share)} · ${money(share * (n - 1))} owed to you`);

}
function splitPreview(f) {
  const total = num(f.total.value), n = Math.max(2, parseInt(f.people.value, 10) || 2), h = document.getElementById('splitHint');
  if (h) h.textContent = total ? `Your share is ${money(total / n)}. ${money(total / n * (n - 1))} comes back to you.` : '';
}
function owedPaid(id) {
  const b = loadBudget(), o = (b.owed || []).find(x => x.id === id);
  if (!o) return;
  o.paid = true; o.paidOn = localDate();
  saveBudget(b); render();
  showToast(`✓ ${escapeHtml(o.name)} paid you ${money(o.amt)}`, { label: 'Undo', fn: () => { const bb = loadBudget(), x = bb.owed.find(y => y.id === id); if (x) { x.paid = false; delete x.paidOn; saveBudget(bb); render(); } } });
}
// A friend who won't pay back: their share becomes your own spending
function owedForgive(id) {
  const b = loadBudget(), o = (b.owed || []).find(x => x.id === id);
  if (!o || !confirm(`Stop waiting for ${o.name}?\n\nTheir ${money(o.amt)} counts as your own spending instead.`)) return;
  b.owed = b.owed.filter(x => x.id !== id);
  saveBudget(b);
  addExpense(o.amt, 'other', `${o.note} · ${o.name}'s share`, localDate());
}

// ═══════════════════════════ CAN I AFFORD IT? ═══════════════════════════
function openAfford() {
  openSheet({
    title: '🤔 Can I afford it?',
    body: `
      <label>Price (₹)</label>
      <input class="field mono" name="price" type="number" inputmode="decimal" min="0" step="1" placeholder="e.g. 1500" oninput="affordAnswer(this.value)" style="font-size:20px;font-weight:700">
      <div id="affordOut" class="afford-out"></div>`,
    saveLabel: 'Done',
    onSave: () => {}
  });
}
function affordAnswer(v) {
  const out = document.getElementById('affordOut'), price = num(v);
  if (!out) return;
  if (!price) { out.innerHTML = ''; return; }
  const b = loadBudget(), k = calc(b);
  if (!k.plan) { out.innerHTML = `<p>Set this month's money on Today first, so there's something to check against.</p>`; return; }
  const pool = savingsPool(b), days = k.daysLeft;
  const perDay = x => money(Math.max(0, Math.floor(x)));
  const savePerDay = k.plan.save / 30;
  const saveDays = savePerDay > 0 ? Math.ceil(price / savePerDay) : null;
  const goal = b.goals.filter(g => (g.saved || 0) < g.target).sort((a, c) => (a.date || '9999') < (c.date || '9999') ? -1 : 1)[0];
  let verdict, cls, more = [];
  if (price <= k.freeToday) {
    verdict = 'Yes, it fits in today.'; cls = 'yes';
    more.push(`You'd still have ${money(Math.floor(k.freeToday - price))} free today.`);
  } else if (price <= k.freeMonth) {
    verdict = 'Yes, but it eats into the rest of the month.'; cls = 'maybe';
    const after = (k.freeMonth - price) / days;
    more.push(`Your daily amount drops from ${perDay(k.freeMonth / days)} to ${perDay(after)} for the next ${days} day${days === 1 ? '' : 's'}.`);
  } else if (pool.free >= price) {
    verdict = 'Not from this month, but your savings could cover it.'; cls = 'maybe';
    more.push(`You have ${money(pool.free)} of savings not in a goal.`);
  } else {
    verdict = 'Not right now.'; cls = 'no';
    more.push(`It's ${money(Math.ceil(price - Math.max(0, k.freeMonth)))} more than you have left this month.`);
  }
  if (saveDays) more.push(`At your saving pace, that's about ${saveDays} day${saveDays === 1 ? '' : 's'} of saving.`);
  if (goal && saveDays && cls !== 'yes') more.push(`Buying it could push ${escapeHtml(goal.emoji || '🎯')} ${escapeHtml(goal.name)} back by around ${saveDays} day${saveDays === 1 ? '' : 's'}.`);
  out.innerHTML = `<div class="afford-verdict ${cls}">${verdict}</div>${more.map(m => `<p>${m}</p>`).join('')}`;
}

async function pasteSMS() {
  let text = '';
  try { if (navigator.clipboard && navigator.clipboard.readText) text = await navigator.clipboard.readText(); } catch (_) {}
  if (text && useSMS(text)) return;
  openSheet({
    title: '📋 Paste a payment message',
    desc: 'Copy the SMS your bank or UPI app sent, and paste it here.',
    body: `<textarea class="field" name="sms" rows="5" placeholder="Rs.250.00 debited from A/c XX1234 to VPA zomato@hdfcbank…"></textarea>`,
    saveLabel: 'Read it',
    onSave: f => { if (!useSMS(f.sms.value)) { showToast("Couldn't find an amount in that message"); return false; } }
  });
}
function useSMS(text) {
  const p = window.BudgetCore.parseSMS(text);
  if (!p) return false;
  closeSheet();
  if (p.credit) { editIncome(null, { amt: p.amt, note: p.note }); return true; }

  if (q) { q.value = `${p.note ? p.note + ' ' : ''}${p.amt}`; q.focus(); }

  showToast(`Read ${money(p.amt)}${p.note ? ' · ' + escapeHtml(p.note) : ''}. Check it, then tap Log.`);

}

function exportCSV() {
  const b = loadBudget();
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['Date', 'Type', 'Amount', 'Category', 'Note']];
  b.expenses.forEach(e => rows.push([e.date, 'Spent', e.amt, catOf(e.cat).label, e.note || '']));
  (b.incomes || []).forEach(x => rows.push([x.date, x.toSavings ? 'Money in (to savings)' : 'Money in', x.amt, '', x.note || '']));
  rows.sort((a, c) => a[0] < c[0] ? -1 : a[0] > c[0] ? 1 : 0);
  const csv = rows.map(r => r.map(q).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `budget-${localDate()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// Usuals you tend to log around this hour come first
function usualsByTime(b) {
  const h = new Date().getHours(), at = {};
  b.expenses.slice(-300).forEach(e => { if (e.usualId) (at[e.usualId] = at[e.usualId] || []).push(new Date(e.ts).getHours()); });
  const dist = u => {
    const hs = at[u.id];
    if (!hs || !hs.length) return 6;
    return Math.min(...hs.map(x => { const d = Math.abs(x - h); return Math.min(d, 24 - d); }));
  };
  return b.usuals.map((u, i) => ({ u, i, d: dist(u) })).sort((a, c) => a.d - c.d || a.i - c.i).map(x => x.u);
}
